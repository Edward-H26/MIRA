{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'chat/conversation.css' %}?v={% now 'U' %}">
{% endblock %}

{% block page_body %}
<div class="flex flex-1 overflow-hidden">
  {% include "chat/includes/conversation_sidebar.html" %}

  <main class="flex-1 flex flex-col h-full bg-white/70 backdrop-blur-sm">
    <!-- Empty State / New Chat -->
    <div class="flex-1 flex items-center justify-center px-8">
      <div class="w-full max-w-[600px]">
        <h1 class="font-manrope font-extrabold text-mm-primary text-[28px] tracking-[-1px] mb-8 text-center">
          Start your project here,
        </h1>

        <form method="post" action="{% url 'memoria:home' %}" id="home-start-form">
          {% csrf_token %}
          <div class="bg-mm-card rounded-xl border border-mm-border">
            <input
              type="text"
              name="message"
              placeholder="Enter what you think here..."
              aria-label="Project starter"
              id="home-start-input"
              class="w-full bg-transparent border-none outline-none px-5 py-4 font-inter text-[14px] text-mm-text placeholder:text-mm-light"
            >
            <div class="flex items-center justify-between px-4 pb-3">
              <button type="button" class="p-1.5 rounded-md hover:bg-white transition-colors">
                <svg class="w-[18px] h-[18px] text-mm-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"></path>
                </svg>
              </button>
              <button type="submit" id="home-start-submit" class="btn-gradient px-5 py-2.5 rounded-lg font-inter font-semibold text-[14px] transition-colors flex items-center gap-2">
                Continue
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="22" y1="2" x2="11" y2="13"></line>
                  <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
{% endblock %}

{% block extra_js %}
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const form = document.getElementById("home-start-form");
    const input = document.getElementById("home-start-input");
    const submitButton = document.getElementById("home-start-submit");
    if (!form || !input || !submitButton) {
      return;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) {
        return;
      }

      submitButton.disabled = true;
      input.disabled = true;

      try {
        const response = await fetch(form.action, {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8",
            "X-CSRFToken": form.querySelector('input[name="csrfmiddlewaretoken"]')?.value || "",
            "X-Requested-With": "XMLHttpRequest",
          },
          body: new URLSearchParams({ message }),
        });

        if (!response.ok) {
          throw new Error(`Request failed with status ${response.status}`);
        }

        const payload = await response.json();
        if (payload.redirect_url) {
          window.location.href = payload.redirect_url;
          return;
        }
        throw new Error("Missing redirect URL");
      } catch (_) {
        input.disabled = false;
        submitButton.disabled = false;
        form.submit();
      }
    });
  });
</script>
{% endblock %}
