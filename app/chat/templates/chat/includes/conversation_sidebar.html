{% load chat_extras %}
<div class="bg-white/70 backdrop-blur-sm border-r border-mm-border w-[360px] h-full flex flex-col flex-shrink-0 max-lg:hidden" data-conv-sidebar>
    <!-- Header -->
    <div class="px-5 py-4 border-b border-mm-border flex items-center justify-between">
        <div class="font-inter font-semibold text-mm-muted text-[10px] tracking-[0.5px] uppercase leading-5">
            Conversations
        </div>
        <button onclick="createNewChat()" class="btn-gradient px-3 py-1.5 rounded-md font-inter font-semibold text-[12px] transition-colors flex items-center gap-1.5">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            New
        </button>
    </div>

    <!-- Search -->
    <div class="px-5 py-3">
        <div class="border border-mm-border rounded relative">
            <div class="flex items-center pl-9 pr-4 py-2">
                <input
                    id="conv-sidebar-search"
                    type="text"
                    placeholder="Search conversations..."
                    class="w-full bg-transparent border-none outline-none font-inter font-medium text-mm-light text-[12px] tracking-[0.35px] placeholder:text-mm-light"
                >
            </div>
            <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-mm-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
        </div>
    </div>

    <!-- Conversation List -->
    <div class="flex-1 overflow-y-auto px-3 py-2">
        <!-- Groups Link -->
        <div class="px-2 mb-3">
            <a href="{% url 'chat:group_list' %}" class="flex items-center gap-2 px-2 py-2 rounded-lg hover:bg-mm-hover transition-colors text-mm-muted font-inter font-semibold text-[12px]">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 00-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 010 7.75"></path>
                </svg>
                View Groups
            </a>
        </div>

        <div class="mb-4">
            <div class="px-2 mb-3">
                <div class="font-inter font-semibold text-mm-muted text-[10px] tracking-[0.5px] uppercase leading-5">
                    Recent Chats
                </div>
            </div>
            <div class="flex flex-col gap-2" id="conv-sidebar-list">
                {% for s in sessions %}
                <div class="conv-sidebar-item group relative" data-id="{{ s.id }}">
                    <a href="{{ s.get_absolute_url }}" class="conv-sidebar-content flex gap-3 items-center px-2 py-2 rounded-lg hover:bg-mm-hover transition-colors {% if session and session.id == s.id %}bg-mm-hover{% endif %}">
                        <div class="bg-mm-primary rounded-xl flex-shrink-0 w-8 h-8 flex items-center justify-center text-white font-semibold text-[14px]">
                            {{ s.title|default:"U"|truncatechars:1 }}
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="conv-sidebar-title font-inter font-semibold text-mm-text text-[12px] tracking-[0.35px] leading-4 truncate">
                                {{ s.title|default:"Untitled" }}
                            </div>
                            <div class="font-inter font-medium text-mm-muted text-[10px] tracking-[0.35px] leading-5 truncate">
                                {{ s.updated_at|relative_time }}
                            </div>
                        </div>
                    </a>
                    <div class="conv-sidebar-actions absolute right-2 top-1/2 -translate-y-1/2 flex gap-0.5 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onclick="event.preventDefault(); event.stopPropagation(); renameConversation('{{ s.id }}')" class="w-6 h-6 flex items-center justify-center rounded hover:bg-mm-border/60" title="Rename">
                            <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                            </svg>
                        </button>
                        <button onclick="event.preventDefault(); event.stopPropagation(); deleteConversation('{{ s.id }}')" class="w-6 h-6 flex items-center justify-center rounded hover:bg-red-100" title="Delete">
                            <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                {% empty %}
                <div class="px-2 py-4 text-center text-mm-muted text-[13px] font-inter">
                    No conversations yet
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
