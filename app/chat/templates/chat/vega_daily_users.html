{% extends "base.html" %}
{% load static %}
{% block title %}Daily Active Users (Vega-Lite){% endblock %}

{% block content %}
<div class="page-container">
    <div class="mb-8">
        <h1 class="font-manrope font-extrabold text-mm-primary text-[32px] tracking-[-1px] mb-2">Daily Active Users</h1>
        <p class="font-inter text-mm-muted text-[16px]">Interactive Vega-Lite visualization</p>
    </div>
    <div class="border border-mm-border rounded-2xl p-8 bg-white">
        <div id="vis"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
<script>
    const specUrl = "{% static 'chat/vega_specs/vega_daily_users_bar.json' %}";
    vegaEmbed("#vis", specUrl, {actions: true});
</script>
{% endblock %}
